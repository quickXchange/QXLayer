openapi: 3.1.0
info:
  title: Supabase authentication trial
  version: 1.0.0
paths:
  /supabase-auth/status:
    get:
      operationId: getSupabaseAuthStatus
      responses:
        "200":
          description: Staging-only availability, no credentials
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupabaseAuthStatus"}
  /supabase-auth/session:
    get:
      operationId: getSupabaseAuthSession
      responses:
        "200":
          description: Public session state; provider tokens never leave the server
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupabaseSession"}
  /supabase-auth/action:
    post:
      operationId: performSupabaseAuthAction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SupabaseActionInput"}
      responses:
        "200":
          description: Completed authentication action
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupabaseActionResult"}
        "400":
          description: Invalid input or expired proof
        "401":
          description: Authentication required
        "403":
          description: Forbidden action or unverified email
        "409":
          description: Identity already linked
        "429":
          description: Too many attempts
        "503":
          description: Provider or mail temporarily unavailable
components:
  schemas:
    SupabaseAuthStatus:
      type: object
      required: [enabled, mailReady, provider]
      properties:
        enabled: {type: boolean}
        mailReady: {type: boolean}
        provider: {type: string, enum: [supabase]}
    SupabasePublicUser:
      type: object
      required: [id, email, name, emailVerified, twoFactorEnabled]
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        emailVerified: {type: boolean}
        twoFactorEnabled: {type: boolean}
        totpFactorId: {type: ["string", "null"]}
    SupabaseSession:
      type: object
      required: [user, mfaRequired, recovery]
      properties:
        user:
          oneOf:
            - {$ref: "#/components/schemas/SupabasePublicUser"}
            - {type: "null"}
        mfaRequired: {type: boolean}
        emailMfaAvailable:
          type: boolean
          description: Development only; server-confirmed Super Admin with verified Gmail and existing TOTP. Never inferred from browser metadata.
        emailMfaChallengeExpiresAt:
          type: integer
          description: Development only; expiry in epoch milliseconds of this browser session's usable email MFA challenge. No code or proof is exposed.
        emailLoginChallengeExpiresAt:
          type: integer
          description: Development only; public expiry of the current HttpOnly browser-bound passwordless challenge, including indistinguishable ineligible-account challenges.
        recovery: {type: boolean}
        recoveryCodesRemaining:
          type: integer
          minimum: 0
          description: Development-only unused recovery codes, visible only after MFA.
        existingAccountLinked:
          type: boolean
          description: Whether this authenticated subject already has an explicit identity link. Does not grant access or expose preserved IDs.
    SupabaseActionInput:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [signup, login, login-email-send, login-email-verify, logout, recover, resend, verify, reset-password, change-password, mfa-enroll, mfa-verify, mfa-email-send, mfa-email-verify, mfa-remove, link-existing, mfa-recovery-generate, mfa-recover]
        email: {type: string, format: email, maxLength: 254}
        name: {type: string, minLength: 1, maxLength: 120}
        password: {type: string, maxLength: 128}
        currentPassword: {type: string, maxLength: 128}
        token: {type: string, maxLength: 2048}
        tokenType: {type: string, enum: [signup, recovery]}
        code: {type: string, pattern: '^[0-9]{6}$'}
        recoveryCode: {type: string, minLength: 32, maxLength: 64}
        confirmReplace: {type: boolean}
        confirmReset: {type: boolean}
        factorId: {type: string, format: uuid}
    SupabaseActionResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        emailLoginChallengeExpiresAt:
          type: integer
          description: Development passwordless send receipt; must match the subsequent cookie-bound session readback before asking for the emailed code.
        ok: {type: boolean}
        recoveryCodes:
          type: array
          items: {type: string}
          description: Development-only plaintext codes returned once after fresh password and TOTP proof.
        mfaRequired: {type: boolean}
        user: {$ref: "#/components/schemas/SupabasePublicUser"}
        factorId: {type: string}
        totpUri: {type: string}
        qrCode: {type: string}
        secret: {type: string}
        linked: {type: boolean}
