openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sandbox administration and multi-tenant provisioning API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: platform
    description: Platform operator foundation
  - name: tenants
    description: Tenant administration and provisioning
  - name: catalog
    description: Sandbox product, asset, and network catalogs
paths:
  /demo/session:
    get:
      operationId: getDemoSession
      responses:
        "200": {description: Current development sandbox demo session, content: {application/json: {schema: {$ref: "#/components/schemas/DemoSession"}}}}
    post:
      operationId: startDemoSession
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DemoLoginInput"}
      responses:
        "200": {description: Restricted read-only demo session, content: {application/json: {schema: {$ref: "#/components/schemas/DemoSession"}}}}
        "401": {description: Incorrect demo credentials}
        "503": {description: Development demo not provisioned}
    delete:
      operationId: endDemoSession
      responses:
        "200": {description: Demo session ended, content: {application/json: {schema: {$ref: "#/components/schemas/DemoSession"}}}}
  /customer/white-label-catalog:
    get:
      operationId: getWhiteLabelCatalog
      responses:
        "200": {description: Existing enabled Exchange plans and add-ons, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelCatalog"}}}}
  /customer/white-label-requests/{requestId}:
    get:
      operationId: getMyWhiteLabelRequest
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Own order with customer-visible history only, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelOrderDetail"}}}}
  /operator/white-label-requests/{requestId}:
    get:
      operationId: getWhiteLabelRequest
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Super Admin order and complete history, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelOrderDetail"}}}}
  /operator/white-label-requests/{requestId}/notes:
    post:
      operationId: addWhiteLabelNote
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelNoteInput"}}}}
      responses:
        "201": {description: Appended immutable note, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelEvent"}}}}
  /customer/admin-panels:
    get:
      operationId: listMyAdminPanels
      responses:
        "200": {description: Provisioned Exchange projects authorized for the current QXLayer session, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/CustomerAdminPanel"}}}}}
  /customer/white-label-requests:
    get:
      operationId: listMyWhiteLabelRequests
      responses:
        "200": {description: Current customer's orders, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/WhiteLabelRequest"}}}}}
    post:
      operationId: submitWhiteLabelRequest
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelRequestInput"}}}}
      responses:
        "201": {description: Submitted Exchange request, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelRequest"}}}}
  /operator/white-label-requests:
    get:
      operationId: listWhiteLabelRequests
      responses:
        "200": {description: Super Admin request queue, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/WhiteLabelRequest"}}}}}
  /operator/white-label-requests/{requestId}/review:
    put:
      operationId: reviewWhiteLabelRequest
      parameters:
        - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelReviewInput"}}}}
      responses:
        "200": {description: Operator-reviewed request, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelRequest"}}}}
  /operator/white-label-requests/{requestId}/provision:
    post:
      operationId: provisionWhiteLabelRequest
      parameters:
        - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeDeliveryInput"}
      responses:
        "200": {description: Completed handoff into the existing customer account, content: {application/json: {schema: {$ref: "#/components/schemas/WhiteLabelRequest"}}}}
  /tenants/{tenantId}/exchange/audit:
    get:
      operationId: listExchangeAudit
      parameters:
        - {$ref: "#/components/parameters/TenantId"}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Paginated tenant-scoped audit events, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeAuditList"}}}}
  /tenants/{tenantId}/exchange:
    parameters:
      - {$ref: "#/components/parameters/TenantId"}
    get:
      operationId: getExchangeConfiguration
      responses:
        "200": {description: Tenant sandbox configuration, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeConfiguration"}}}}
    put:
      operationId: saveExchangeConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeSettings"}
      responses:
        "200": {description: Saved sandbox configuration, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeConfiguration"}}}}
  /tenants/{tenantId}/exchange/orders:
    get:
      operationId: listExchangeOrders
      parameters:
        - {$ref: "#/components/parameters/TenantId"}
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: status, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {name: to, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {name: customer, in: query, schema: {type: string, enum: [anonymous]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Paginated sandbox orders, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeOrderList"}}}}
  /tenants/{tenantId}/exchange/orders/{orderId}:
    parameters:
      - {$ref: "#/components/parameters/TenantId"}
      - {name: orderId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getExchangeOrder
      responses:
        "200": {description: Tenant order details, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeOrder"}}}}
    put:
      operationId: updateExchangeOrderStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeStatusInput"}
      responses:
        "200": {description: Updated simulated order, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeOrder"}}}}
  /tenants/{tenantId}/exchange/dashboard:
    get:
      operationId: getExchangeDashboard
      parameters:
        - {$ref: "#/components/parameters/TenantId"}
      responses:
        "200": {description: Sandbox exchange overview, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeDashboard"}}}}
  /tenants/{tenantId}/exchange/customers:
    get:
      operationId: listExchangeCustomers
      parameters:
        - {$ref: "#/components/parameters/TenantId"}
      responses:
        "200": {description: Tenant-scoped customer summary; sandbox orders do not collect identity, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ExchangeCustomer"}}}}}
  /public/sites/{slug}/exchange:
    get:
      operationId: getPublicExchange
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Public tenant exchange, content: {application/json: {schema: {$ref: "#/components/schemas/PublicExchange"}}}}
  /public/sites/{slug}/exchange/quotes:
    post:
      operationId: createSandboxQuote
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeQuoteInput"}
      responses:
        "200": {description: Signed sandbox quote, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeQuote"}}}}
  /public/sites/{slug}/exchange/orders:
    post:
      operationId: createSandboxOrder
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeOrderInput"}
      responses:
        "201": {description: Simulated order and private tracking capability, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeOrderCreated"}}}}
  /public/sites/{slug}/exchange/orders/{orderId}:
    get:
      operationId: trackSandboxOrder
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: orderId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: trackingToken, in: header, required: true, schema: {type: string, minLength: 32, maxLength: 200}}
      responses:
        "200": {description: Capability-protected order tracking, content: {application/json: {schema: {$ref: "#/components/schemas/ExchangeOrder"}}}}
  /public/product-catalog:
    get:
      operationId: getPublicProductCatalog
      tags: [catalog]
      responses:
        "200":
          description: Visible marketing products, not executable services
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/LandingProduct"}}
  /landing-products:
    get:
      operationId: listLandingProducts
      tags: [catalog]
      responses:
        "200":
          description: Super Admin catalog including hidden products
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/LandingProduct"}}
  /landing-products/{productKey}:
    put:
      operationId: updateLandingProduct
      tags: [catalog]
      parameters:
        - {name: productKey, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 80, pattern: "^[a-z][a-z0-9_]*$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LandingProductInput"}
      responses:
        "200":
          description: Saved marketing product
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LandingProduct"}
  /tenants/{tenantId}/administrators:
    parameters: [{$ref: "#/components/parameters/TenantId"}]
    get:
      operationId: listTenantAdministrators
      tags: [tenants]
      responses:
        "200":
          description: Assigned Client Admins
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ResourceItem"}}
    post:
      operationId: assignTenantAdministrator
      tags: [tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TenantAdministratorInput"}
      responses:
        "201":
          description: Client Admin assigned by Super Admin
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MutationStatus"}
  /tenants/{tenantId}/administrators/{userId}:
    put:
      operationId: setTenantAdministratorStatus
      tags: [tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - {name: userId, in: path, required: true, schema: {type: string, pattern: "^user_[a-zA-Z0-9]+$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TenantAdministratorStatusInput"}
      responses:
        "200":
          description: Client Admin activation changed by Super Admin
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MutationStatus"}
  /tenants/{tenantId}/products/{moduleKey}/configuration:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - {name: moduleKey, in: path, required: true, schema: {type: string, maxLength: 64, pattern: "^[a-z][a-z0-9_]*$"}}
    get:
      operationId: getProductConfiguration
      tags: [tenants]
      responses:
        "200":
          description: Tenant product settings only, never execution
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductConfiguration"}
    put:
      operationId: setProductConfiguration
      tags: [tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductConfiguration"}
      responses:
        "200":
          description: Stored configuration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductConfiguration"}
  /catalog/products:
    get:
      operationId: listProductRegistry
      tags: [catalog]
      responses:
        "200":
          description: Generic product registry
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ProductModule"}}
    post:
      operationId: registerProductModule
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductModule"}
      responses:
        "201":
          description: Deferred module registered
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductModule"}
  /tenants/{tenantId}/staff/{userId}/permissions:
    put:
      operationId: setStaffPermissions
      tags: [tenants]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - {name: userId, in: path, required: true, schema: {type: string, pattern: "^user_[a-zA-Z0-9]+$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StaffPermissions"}
      responses:
        "200":
          description: Staff permissions saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MutationStatus"}
  /tenants/{tenantId}/domain-verification:
    get:
      operationId: getDomainVerification
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      responses:
        "200":
          description: DNS ownership challenge (not a hosting connection)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DomainVerification"}
    post:
      operationId: verifyTenantDomain
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      responses:
        "200":
          description: Ownership verified
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DomainVerification"}
  /public/domains/{hostname}:
    get:
      operationId: resolvePublicDomain
      tags: [website]
      parameters: [{name: hostname, in: path, required: true, schema: {type: string, maxLength: 253}}]
      responses:
        "200":
          description: Active entitled tenant for a verified domain
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicSite"}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentPrincipal
      tags: [platform]
      summary: Get the signed-in platform identity and role
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentPrincipal"
        "401":
          description: Sign-in required
  /overview:
    get:
      operationId: getPlatformOverview
      tags: [platform]
      summary: Get a safe administrative overview
      responses:
        "200":
          description: Overview metrics and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOverview"
        "401":
          description: Sign-in required
  /activity:
    get:
      operationId: listPlatformActivity
      tags: [platform]
      summary: List recent administrative activity
      responses:
        "200":
          description: Recent activity, scoped to the current administrator
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
        "401":
          description: Sign-in required
  /modules:
    get:
      operationId: listModuleCatalog
      tags: [catalog]
      summary: List available product modules
      responses:
        "200":
          description: Product module catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleDefinition"
  /asset-networks:
    get:
      operationId: listSandboxAssetNetworks
      tags: [catalog]
      summary: List supported sandbox assets and networks
      responses:
        "200":
          description: Sandbox catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetNetworkCatalog"
  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List tenants visible to the current administrator
      responses:
        "200":
          description: Tenant list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantSummary"
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a draft tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Draft tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Invalid tenant input
        "401":
          description: Sign-in required
        "403":
          description: Super administrator access required
        "409":
          description: Tenant slug is already in use
  /tenants/{tenantId}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get one tenant and its provisioning state
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          description: Sign-in required
        "403":
          description: Tenant access denied
        "404":
          description: Tenant not found
  /tenants/{tenantId}/brand:
    put:
      operationId: updateTenantBrand
      tags: [tenants]
      summary: Set the tenant brand
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "200":
          description: Brand saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Invalid brand settings
        "401":
          description: Sign-in required
        "403":
          description: Tenant access denied
        "404":
          description: Tenant not found
  /tenants/{tenantId}/domain:
    put:
      operationId: updateTenantDomain
      tags: [tenants]
      summary: Set or clear a tenant domain
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainInput"
      responses:
        "200":
          description: Domain settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Invalid domain
        "401":
          description: Sign-in required
        "403":
          description: Tenant access denied
        "404":
          description: Tenant not found
        "409":
          description: Domain is already assigned
  /tenants/{tenantId}/modules:
    put:
      operationId: updateTenantModules
      tags: [tenants]
      summary: Set enabled product modules for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantModulesInput"
      responses:
        "200":
          description: Module entitlements saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Invalid module selection
        "401":
          description: Sign-in required
        "403":
          description: Tenant access denied
        "404":
          description: Tenant not found
  /tenants/{tenantId}/assets-networks:
    put:
      operationId: updateTenantAssetsNetworks
      tags: [tenants]
      summary: Set supported sandbox assets and networks for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetsNetworksInput"
      responses:
        "200":
          description: Supported assets and networks saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Invalid catalog selection
        "401":
          description: Sign-in required
        "403":
          description: Tenant access denied
        "404":
          description: Tenant not found
  /tenants/{tenantId}/configuration:
    put:
      operationId: updateTenantConfiguration
      tags: [tenants]
      summary: Set sandbox-only tenant configuration
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantConfigurationInput"
      responses:
        "200":
          description: Configuration saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Invalid configuration
        "401":
          description: Sign-in required
        "403":
          description: Tenant access denied
        "404":
          description: Tenant not found
  /tenants/{tenantId}/launch:
    post:
      operationId: activateTenant
      tags: [tenants]
      summary: Activate a fully provisioned tenant in sandbox mode
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant activated in sandbox mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Required provisioning steps are incomplete
        "401":
          description: Sign-in required
        "403":
          description: Tenant access denied
        "404":
          description: Tenant not found
  /entitlement-definitions:
    get:
      operationId: listEntitlementDefinitions
      tags: [catalog]
      responses:
        "200":
          description: Generic feature and limit definitions
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/EntitlementDefinition"}}
  /plans:
    get:
      operationId: listPlans
      tags: [platform]
      responses:
        "200":
          description: Database-driven plans
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Plan"}}
    post:
      operationId: createPlan
      tags: [platform]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PlanInput"}}}}
      responses:
        "201": {description: Plan created, content: {application/json: {schema: {$ref: "#/components/schemas/Plan"}}}}
  /plans/{planId}:
    parameters: [{$ref: "#/components/parameters/PlanId"}]
    get:
      operationId: getPlan
      tags: [platform]
      responses:
        "200": {description: Plan detail, content: {application/json: {schema: {$ref: "#/components/schemas/Plan"}}}}
    put:
      operationId: updatePlan
      tags: [platform]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PlanInput"}}}}
      responses:
        "200": {description: Plan updated, content: {application/json: {schema: {$ref: "#/components/schemas/Plan"}}}}
  /plans/{planId}/duplicate:
    post:
      operationId: duplicatePlan
      tags: [platform]
      parameters: [{$ref: "#/components/parameters/PlanId"}]
      responses:
        "201": {description: Independent disabled copy created, content: {application/json: {schema: {$ref: "#/components/schemas/Plan"}}}}
  /plans/{planId}/status:
    put:
      operationId: setPlanStatus
      tags: [platform]
      parameters: [{$ref: "#/components/parameters/PlanId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PlanStatusInput"}}}}
      responses:
        "200": {description: Plan lifecycle updated, content: {application/json: {schema: {$ref: "#/components/schemas/Plan"}}}}
  /add-ons:
    get:
      operationId: listAddons
      tags: [platform]
      responses:
        "200": {description: Add-on catalog, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Addon"}}}}}
    post:
      operationId: createAddon
      tags: [platform]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AddonInput"}}}}
      responses:
        "201": {description: Add-on created, content: {application/json: {schema: {$ref: "#/components/schemas/Addon"}}}}
  /add-ons/{addonId}:
    put:
      operationId: updateAddon
      tags: [platform]
      parameters: [{name: addonId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AddonInput"}}}}
      responses:
        "200": {description: Add-on saved, content: {application/json: {schema: {$ref: "#/components/schemas/Addon"}}}}
  /tenants/{tenantId}/subscription:
    get:
      operationId: getTenantSubscription
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      responses:
        "200": {description: "Current plan, effective rights, overrides and live usage", content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionView"}}}}
  /tenants/{tenantId}/subscription/plan:
    put:
      operationId: changeTenantPlan
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionPlanInput"}}}}
      responses:
        "200": {description: Plan changed without billing, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionView"}}}}
  /tenants/{tenantId}/subscription/add-ons:
    put:
      operationId: setTenantAddons
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionAddonInput"}}}}
      responses:
        "200": {description: Tenant add-ons changed, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionView"}}}}
  /tenants/{tenantId}/subscription/overrides:
    put:
      operationId: setTenantOverrides
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/EntitlementOverrideInput"}}}}
      responses:
        "200": {description: Tenant-only overrides replaced, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionView"}}}}
  /tenants/{tenantId}/suspension:
    put:
      operationId: setTenantSuspension
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SuspensionInput"}}}}
      responses:
        "200": {description: Tenant suspension saved, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionView"}}}}
  /tenants/{tenantId}/website-settings:
    put:
      operationId: updateTenantWebsiteSettings
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/WebsiteSettings"}}}}
      responses:
        "200": {description: Shared template settings saved, content: {application/json: {schema: {$ref: "#/components/schemas/Tenant"}}}}
  /tenants/{tenantId}/resources/{resourceType}:
    parameters: [{$ref: "#/components/parameters/TenantId"}, {$ref: "#/components/parameters/ResourceType"}]
    get:
      operationId: listTenantResources
      tags: [tenants]
      responses:
        "200": {description: Sandbox resource configuration, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ResourceItem"}}}}}
    post:
      operationId: createTenantResource
      tags: [tenants]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ResourceInput"}}}}
      responses:
        "201": {description: Resource created with atomic quota enforcement, content: {application/json: {schema: {$ref: "#/components/schemas/ResourceCreated"}}}}
  /tenants/{tenantId}/resources/{resourceType}/{resourceId}:
    delete:
      operationId: removeTenantResource
      tags: [tenants]
      parameters: [{$ref: "#/components/parameters/TenantId"}, {$ref: "#/components/parameters/ResourceType"}, {name: resourceId, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Resource removed or revoked, content: {application/json: {schema: {$ref: "#/components/schemas/MutationStatus"}}}}
  /public/sites/{slug}:
    get:
      operationId: getPublicSite
      tags: [catalog]
      parameters: [{name: slug, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"}}]
      responses:
        "200": {description: Allowlisted public tenant website configuration, content: {application/json: {schema: {$ref: "#/components/schemas/PublicSite"}}}}
  /public/sites/{slug}/capabilities/{feature}:
    get:
      operationId: getPublicCapability
      tags: [catalog]
      parameters: [{name: slug, in: path, required: true, schema: {type: string}}, {name: feature, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Enabled foundation entry point; no product execution, content: {application/json: {schema: {$ref: "#/components/schemas/CapabilityStatus"}}}}
components:
  parameters:
    PlanId: {name: planId, in: path, required: true, schema: {type: string, format: uuid}}
    ResourceType: {name: resourceType, in: path, required: true, schema: {type: string, enum: [staff, api_keys, webhooks, payment_methods]}}
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    WhiteLabelStatus:
      type: string
      enum: [new, reviewing, waiting_for_client, quote_ready, approved, in_setup, customization, ready, delivered, rejected, cancelled]
    WhiteLabelDesign:
      type: object
      required: [type, styleName, primaryColor, accentColor, themePreference, description, referenceWebsiteUrl, notes, logoAttachmentId, faviconAttachmentId, referenceAttachmentIds]
      properties:
        type: {type: string, enum: [standard, custom]}
        styleName: {type: string, maxLength: 100}
        primaryColor: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        accentColor: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        themePreference: {type: string, enum: [light, dark, both]}
        description: {type: string, maxLength: 5000}
        referenceWebsiteUrl: {type: ["string", "null"], maxLength: 2048}
        notes: {type: string, maxLength: 5000}
        logoAttachmentId: {type: ["string", "null"], format: uuid}
        faviconAttachmentId: {type: ["string", "null"], format: uuid}
        referenceAttachmentIds: {type: array, maxItems: 10, items: {type: string, format: uuid}}
    WhiteLabelAttachment:
      type: object
      required: [id, fileName, contentType, size, category, createdAt]
      properties:
        id: {type: string, format: uuid}
        fileName: {type: string}
        contentType: {type: string}
        size: {type: integer}
        category: {type: string, enum: [logo, favicon, design_reference, requirement]}
        createdAt: {type: string, format: date-time}
    WhiteLabelCatalog:
      type: object
      required: [plans, addons, definitions]
      properties:
        plans: {type: array, items: {$ref: "#/components/schemas/Plan"}}
        addons: {type: array, items: {$ref: "#/components/schemas/Addon"}}
        definitions: {type: array, items: {$ref: "#/components/schemas/EntitlementDefinition"}}
    WhiteLabelEvent:
      type: object
      required: [id, kind, author, visibility, message, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [status, note]}
        author: {type: string}
        visibility: {type: string, enum: [internal, customer]}
        message: {type: string}
        status: {type: ["string", "null"]}
        createdAt: {type: string, format: date-time}
    WhiteLabelNoteInput:
      type: object
      required: [message, visibility]
      properties:
        message: {type: string, minLength: 1, maxLength: 5000}
        visibility: {type: string, enum: [internal, customer]}
    WhiteLabelOrderDetail:
      type: object
      required: [order, history]
      properties:
        order: {$ref: "#/components/schemas/WhiteLabelRequest"}
        history: {type: array, items: {$ref: "#/components/schemas/WhiteLabelEvent"}}
    ExchangeDeliveryInput:
      type: object
      required: [tenantId]
      properties: {tenantId: {type: string, format: uuid}}
    CustomerAdminPanel:
      type: object
      required: [tenantId, name, brandName, slug, status, role]
      properties:
        tenantId: {type: string, format: uuid}
        name: {type: string}
        brandName: {type: string}
        slug: {type: string}
        status: {type: string, enum: [active, suspended]}
        role: {type: string, enum: [client_admin, staff]}
    WhiteLabelRequestInput:
      type: object
      required: [projectName, brandName, actions, details, idempotencyKey]
      properties:
        projectName: {type: string, minLength: 2, maxLength: 100}
        brandName: {type: string, minLength: 2, maxLength: 100}
        preferredDomain: {type: ["string", "null"], maxLength: 253}
        actions: {type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: {$ref: "#/components/schemas/ExchangeAction"}}
        details: {type: string, maxLength: 10000}
        companyName: {type: ["string", "null"], maxLength: 150}
        design: {$ref: "#/components/schemas/WhiteLabelDesign"}
        requestedPlanId: {type: ["string", "null"], format: uuid}
        requestedAddonIds: {type: array, maxItems: 20, items: {type: string, format: uuid}}
        billingPeriod: {type: string, enum: [monthly, yearly]}
        attachmentIds: {type: array, maxItems: 10, items: {type: string, format: uuid}}
        idempotencyKey: {type: string, format: uuid}
    WhiteLabelReviewInput:
      type: object
      required: [status, monthlyPrice, setupPrice, currency, operatorNote]
      properties:
        status: {$ref: "#/components/schemas/WhiteLabelStatus"}
        monthlyPrice: {type: ["string", "null"], pattern: '^\d{1,12}(\.\d{1,2})?$'}
        setupPrice: {type: ["string", "null"], pattern: '^\d{1,12}(\.\d{1,2})?$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        operatorNote: {type: string, maxLength: 5000}
        customizationPrice: {type: ["string", "null"], pattern: '^\d{1,12}(\.\d{1,2})?$'}
        approvedPlanId: {type: ["string", "null"], format: uuid}
        approvedAddonIds: {type: array, maxItems: 20, items: {type: string, format: uuid}}
        customDesignDecision: {type: string, enum: [pending, approved, rejected]}
    WhiteLabelRequest:
      type: object
      required: [id, customerUserId, projectName, brandName, preferredDomain, actions, details, status, monthlyPrice, setupPrice, currency, operatorNote, tenantId, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        customerUserId: {type: string}
        projectName: {type: string}
        brandName: {type: string}
        preferredDomain: {type: ["string", "null"]}
        actions: {type: array, items: {$ref: "#/components/schemas/ExchangeAction"}}
        details: {type: string}
        status: {$ref: "#/components/schemas/WhiteLabelStatus"}
        orderReference: {type: string}
        companyName: {type: ["string", "null"]}
        design: {oneOf: [{$ref: "#/components/schemas/WhiteLabelDesign"}, {type: "null"}]}
        billingPeriod: {type: string, enum: [monthly, yearly]}
        requestedPlan: {oneOf: [{$ref: "#/components/schemas/Plan"}, {type: "null"}]}
        requestedAddons: {type: array, items: {$ref: "#/components/schemas/Addon"}}
        approvedPlan: {oneOf: [{$ref: "#/components/schemas/Plan"}, {type: "null"}]}
        approvedAddons: {type: array, items: {$ref: "#/components/schemas/Addon"}}
        attachments: {type: array, items: {$ref: "#/components/schemas/WhiteLabelAttachment"}}
        customizationPrice: {type: ["string", "null"]}
        customDesignDecision: {type: string, enum: [pending, approved, rejected]}
        monthlyPrice: {type: ["string", "null"]}
        setupPrice: {type: ["string", "null"]}
        currency: {type: ["string", "null"]}
        operatorNote: {type: string}
        tenantId: {type: ["string", "null"], format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ExchangeAuditList:
      type: object
      required: [events, total, page, pageSize]
      properties:
        events: {type: array, items: {$ref: "#/components/schemas/ActivityEvent"}}
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
    ExchangeAction:
      type: string
      enum: [swap, convert, buy, sell]
    ExchangeAssetSettings:
      type: object
      required: [assetId, enabled, displayOrder, symbol, decimals, logoUrl, sandboxPlanRate]
      properties:
        assetId: {type: string, minLength: 1, maxLength: 80}
        enabled: {type: boolean}
        displayOrder: {type: integer, minimum: 0, maximum: 1000}
        symbol: {type: string, minLength: 1, maxLength: 12}
        decimals: {type: integer, minimum: 0, maximum: 18}
        logoUrl: {type: ["string", "null"], maxLength: 2000}
        sandboxPlanRate: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
    ExchangeNetworkSettings:
      type: object
      required: [assetNetworkId, enabled, available, minimum, maximum, fee, information]
      properties:
        assetNetworkId: {type: string, minLength: 1, maxLength: 80}
        enabled: {type: boolean}
        available: {type: boolean}
        minimum: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
        maximum: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
        fee: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
        information: {type: string, maxLength: 500}
        providerId: {type: string, maxLength: 80}
    ExchangeRoute:
      type: object
      required: [id, source, destination, action, enabled, rate, minimum, maximum, feeBps, fixedFee, spreadBps, paymentMethodIds]
      properties:
        id: {type: string, format: uuid}
        source: {type: string, minLength: 1, maxLength: 80}
        destination: {type: string, minLength: 1, maxLength: 80}
        action: {$ref: "#/components/schemas/ExchangeAction"}
        enabled: {type: boolean}
        rate: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
        minimum: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
        maximum: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
        feeBps: {type: integer, minimum: 0, maximum: 5000}
        fixedFee: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
        spreadBps: {type: integer, minimum: 0, maximum: 5000}
        paymentMethodIds: {type: array, maxItems: 30, items: {type: string, format: uuid}}
        providerId: {type: string, maxLength: 80}
    ExchangePaymentMethod:
      type: object
      required: [id, label, enabled, currency, buy, sell]
      properties:
        id: {type: string, format: uuid}
        label: {type: string, minLength: 2, maxLength: 80}
        enabled: {type: boolean}
        currency: {type: string, enum: [USD, EUR, GBP]}
        buy: {type: boolean}
        sell: {type: boolean}
        logoUrl: {type: ["string", "null"], maxLength: 2000}
        methodType: {type: string, enum: [bank, card, manual]}
        minimum: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
        maximum: {type: ["string", "null"], pattern: '^\d{1,18}(\.\d{1,18})?$'}
        feeBps: {type: integer, minimum: 0, maximum: 5000}
        fixedFee: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
    ExchangeProvider:
      type: object
      required: [id, name, category, status, functional, credentialSupport, capabilities]
      properties:
        id: {type: string}
        name: {type: string}
        category: {type: string}
        status: {type: string, enum: [sandbox, configuration_only, coming_soon]}
        functional: {type: boolean}
        credentialSupport: {type: boolean}
        capabilities: {type: array, items: {type: string}}
    ExchangeProviderConfiguration:
      type: object
      required: [providerId, enabled]
      properties:
        providerId: {type: string, maxLength: 80}
        enabled: {type: boolean}
        label: {type: string, maxLength: 100}
        endpoint: {type: ["string", "null"], maxLength: 2000}
    ExchangeSettings:
      type: object
      required: [enabled, actions, assets, networks, routes, paymentMethods, fiatCurrency, fiatPlanRate, defaultAction, publicNote]
      properties:
        enabled: {type: boolean}
        defaultAction: {$ref: "#/components/schemas/ExchangeAction"}
        publicNote: {type: string, maxLength: 1000}
        fiatCurrency: {type: string, enum: [USD, EUR, GBP]}
        fiatPlanRate: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
        actions:
          type: object
          required: [swap, convert, buy, sell]
          properties:
            swap: {type: boolean}
            convert: {type: boolean}
            buy: {type: boolean}
            sell: {type: boolean}
        assets: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/ExchangeAssetSettings"}}
        networks: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/ExchangeNetworkSettings"}}
        routes: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/ExchangeRoute"}}
        paymentMethods: {type: array, maxItems: 30, items: {$ref: "#/components/schemas/ExchangePaymentMethod"}}
        providers: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/ExchangeProviderConfiguration"}}
    ExchangeCatalogAsset:
      type: object
      required: [assetNetworkId, assetId, symbol, name, networkId, networkName, testnet]
      properties:
        assetNetworkId: {type: string}
        assetId: {type: string}
        symbol: {type: string}
        name: {type: string}
        networkId: {type: string}
        networkName: {type: string}
        testnet: {type: boolean}
    ExchangeConfiguration:
      type: object
      required: [configuration, catalog, effectiveEnabled]
      properties:
        configuration: {$ref: "#/components/schemas/ExchangeSettings"}
        catalog: {type: array, items: {$ref: "#/components/schemas/ExchangeCatalogAsset"}}
        effectiveEnabled: {type: boolean}
        providerCatalog: {type: array, items: {$ref: "#/components/schemas/ExchangeProvider"}}
    ExchangeQuoteInput:
      type: object
      required: [action, source, destination, amount]
      properties:
        action: {$ref: "#/components/schemas/ExchangeAction"}
        source: {type: string, minLength: 1, maxLength: 80}
        destination: {type: string, minLength: 1, maxLength: 80}
        amount: {type: string, pattern: '^\d{1,18}(\.\d{1,18})?$'}
        paymentMethodId: {type: string, format: uuid}
    ExchangeQuote:
      type: object
      required: [token, expiresAt, routeId, action, source, destination, sourceSymbol, destinationSymbol, inputAmount, outputAmount, rate, fee, minimum, maximum, spreadBps, sandboxOnly]
      properties:
        token: {type: string}
        expiresAt: {type: string, format: date-time}
        routeId: {type: string, format: uuid}
        action: {$ref: "#/components/schemas/ExchangeAction"}
        source: {type: string}
        destination: {type: string}
        sourceSymbol: {type: string}
        destinationSymbol: {type: string}
        inputAmount: {type: string}
        outputAmount: {type: string}
        rate: {type: string}
        fee: {type: string}
        destinationFee: {type: string}
        minimum: {type: string}
        maximum: {type: string}
        spreadBps: {type: integer}
        sandboxOnly: {type: boolean, const: true}
    ExchangeOrderInput:
      type: object
      required: [quoteToken, idempotencyKey]
      properties:
        quoteToken: {type: string, minLength: 40, maxLength: 12000}
        idempotencyKey: {type: string, format: uuid}
    ExchangeStatusInput:
      type: object
      required: [status, note]
      properties:
        status: {type: string, enum: [pending, processing, completed, cancelled, failed]}
        note: {type: string, maxLength: 500}
    ExchangeOrderEvent:
      type: object
      required: [status, at, note]
      properties:
        status: {type: string}
        at: {type: string, format: date-time}
        note: {type: string}
    ExchangeOrder:
      type: object
      required: [id, status, action, source, destination, sourceSymbol, destinationSymbol, inputAmount, outputAmount, rate, fee, spreadBps, paymentMethod, createdAt, history, sandboxOnly]
      properties:
        id: {type: string, format: uuid}
        status: {type: string}
        action: {$ref: "#/components/schemas/ExchangeAction"}
        source: {type: string}
        destination: {type: string}
        sourceSymbol: {type: string}
        destinationSymbol: {type: string}
        inputAmount: {type: string}
        outputAmount: {type: string}
        rate: {type: string}
        fee: {type: string}
        destinationFee: {type: string}
        spreadBps: {type: integer}
        paymentMethod: {type: ["string", "null"]}
        createdAt: {type: string, format: date-time}
        history: {type: array, items: {$ref: "#/components/schemas/ExchangeOrderEvent"}}
        updatedAt: {type: string, format: date-time}
        customerName: {type: ["string", "null"]}
        customerEmail: {type: ["string", "null"]}
        sandboxOnly: {type: boolean, const: true}
    ExchangeCustomer:
      type: object
      required: [id, name, email, orders, lastActivity, status]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: ["string", "null"]}
        orders: {type: integer}
        lastActivity: {type: string, format: date-time}
        status: {type: string, enum: [unidentified]}
    ExchangeOrderCreated:
      type: object
      required: [order, trackingToken]
      properties:
        order: {$ref: "#/components/schemas/ExchangeOrder"}
        trackingToken: {type: string}
    ExchangeOrderList:
      type: object
      required: [orders, total, page, pageSize]
      properties:
        orders: {type: array, items: {$ref: "#/components/schemas/ExchangeOrder"}}
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
    ExchangeVolume:
      type: object
      required: [symbol, amount]
      properties:
        symbol: {type: string}
        amount: {type: string}
    ExchangeDashboard:
      type: object
      required: [enabled, total, pending, processing, completed, cancelled, failed, assets, networks, routes, volume, recentOrders]
      properties:
        enabled: {type: boolean}
        total: {type: integer}
        pending: {type: integer}
        processing: {type: integer}
        completed: {type: integer}
        cancelled: {type: integer}
        failed: {type: integer}
        assets: {type: integer}
        networks: {type: integer}
        routes: {type: integer}
        customers: {type: integer}
        paymentMethods: {type: integer}
        volume: {type: array, items: {$ref: "#/components/schemas/ExchangeVolume"}}
        recentOrders: {type: array, items: {$ref: "#/components/schemas/ExchangeOrder"}}
    PublicExchange:
      type: object
      required: [enabled, actions, assets, routes, paymentMethods, fiatCurrency, publicNote]
      properties:
        enabled: {type: boolean}
        defaultAction: {$ref: "#/components/schemas/ExchangeAction"}
        actions: {type: array, items: {$ref: "#/components/schemas/ExchangeAction"}}
        assets: {type: array, items: {$ref: "#/components/schemas/AssetNetwork"}}
        routes: {type: array, items: {$ref: "#/components/schemas/ExchangeRoute"}}
        paymentMethods: {type: array, items: {$ref: "#/components/schemas/ExchangePaymentMethod"}}
        fiatCurrency: {type: string}
        publicNote: {type: string}
    LandingProductInput:
      type: object
      required: [visible, name, description, icon, startingPrice, setupFee, currency, billingPeriod, status, ctaLabel, displayOrder]
      properties:
        visible: {type: boolean}
        name: {type: string, minLength: 2, maxLength: 100}
        description: {type: string, minLength: 10, maxLength: 500}
        icon: {type: string, enum: [exchange, card, payments, staking, earn, dex, content, telegram, miniapp, whatsapp, ios, android, engine, nodes, mining, kolo]}
        startingPrice: {type: [string, "null"], pattern: "^(0|[1-9][0-9]{0,9})(\\.[0-9]{1,2})?$"}
        setupFee: {type: [string, "null"], pattern: "^(0|[1-9][0-9]{0,9})(\\.[0-9]{1,2})?$"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        billingPeriod: {type: string, enum: [monthly, yearly, one_time, on_request]}
        status: {type: string, enum: [available, coming_soon]}
        ctaLabel: {type: string, minLength: 2, maxLength: 40}
        displayOrder: {type: integer, minimum: 0, maximum: 10000}
    LandingProduct:
      allOf:
        - $ref: "#/components/schemas/LandingProductInput"
        - type: object
          required: [key, readiness]
          properties:
            key: {type: string}
            readiness: {type: string, enum: [sandbox_only, planned]}
    TenantAdministratorInput:
      type: object
      properties:
        userId: {type: string, pattern: "^user_[a-zA-Z0-9]+$"}
        label: {type: string, minLength: 2, maxLength: 120}
      required: [userId, label]
    TenantAdministratorStatusInput:
      type: object
      properties: {active: {type: boolean}}
      required: [active]
    ProductConfiguration:
      type: object
      properties:
        configuration: {type: object, additionalProperties: {}}
      required: [configuration]
    ProductModule:
      type: object
      properties:
        key: {type: string, maxLength: 64, pattern: "^[a-z][a-z0-9_]*$"}
        name: {type: string, minLength: 2, maxLength: 120}
        description: {type: string, maxLength: 3000}
        category: {type: string, minLength: 2, maxLength: 80}
        lifecycle: {type: string, enum: [core_ready, sandbox_only, deferred]}
        sandboxAvailable: {type: boolean}
        requiresAssetNetworks: {type: boolean}
        features:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              key: {type: string, maxLength: 64, pattern: "^[a-z][a-z0-9_]*$"}
              label: {type: string, minLength: 2, maxLength: 120}
              dependsOn: {type: array, uniqueItems: true, maxItems: 20, items: {type: string, maxLength: 64}}
            required: [key, label, dependsOn]
        limits:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              key: {type: string, maxLength: 64, pattern: "^[a-z][a-z0-9_]*$"}
              label: {type: string, minLength: 2, maxLength: 120}
              valueType: {type: string, enum: [integer, decimal]}
            required: [key, label, valueType]
      required: [key, name, description, category, lifecycle, sandboxAvailable, requiresAssetNetworks, features, limits]
    StaffPermissions:
      type: object
      properties:
        permissions:
          type: array
          uniqueItems: true
          maxItems: 4
          items: {type: string, enum: [branding.manage, domains.manage, configuration.manage, resources.manage]}
      required: [permissions]
    DomainVerification:
      type: object
      properties:
        domain: {type: ["string", "null"]}
        status: {type: string, enum: [unconfigured, unverified, verified]}
        txtName: {type: ["string", "null"]}
        txtValue: {type: ["string", "null"]}
        hostingConnected: {type: boolean}
      required: [domain, status, txtName, txtValue, hostingConnected]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Role:
      type: string
      enum: [super_admin, client_admin, staff, unassigned]
    TenantStatus:
      type: string
      enum: [draft, active, suspended]
    ProvisioningStep:
      type: string
      enum: [brand, domain, modules, assets_networks, configuration, ready]
    ModuleKey:
      type: string
      maxLength: 64
      pattern: "^[a-z][a-z0-9_]*$"
    CurrentPrincipal:
      type: object
      properties:
        demo: {type: boolean}
        userId: { type: string }
        email: { type: ["string", "null"] }
        role: { $ref: "#/components/schemas/Role" }
        tenantId: { type: ["string", "null"], format: uuid }
        sandboxOnly: { type: boolean }
        memberships:
          type: array
          items:
            type: object
            properties:
              tenantId: {type: string, format: uuid}
              role: {type: string, enum: [client_admin, staff]}
              permissions: {type: array, items: {type: string}}
            required: [tenantId, role, permissions]
      required: [userId, email, role, tenantId, sandboxOnly]
    DemoLoginInput:
      type: object
      additionalProperties: false
      properties:
        username: {type: string, maxLength: 100}
        password: {type: string, maxLength: 100}
      required: [username, password]
    DemoSession:
      type: object
      properties:
        active: {type: boolean}
        tenantId: {type: ["string", "null"], format: uuid}
        readOnly: {type: boolean}
      required: [active, tenantId, readOnly]
    PlatformOverview:
      type: object
      properties:
        totalTenants: { type: integer }
        activeTenants: { type: integer }
        draftTenants: { type: integer }
        enabledModules: { type: integer }
        sandboxOnly: { type: boolean }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/ActivityEvent" }
      required: [totalTenants, activeTenants, draftTenants, enabledModules, sandboxOnly, recentActivity]
    ActivityEvent:
      type: object
      properties:
        id: { type: string }
        eventType: { type: string }
        actorId: {type: string}
        description: { type: string }
        tenantId: { type: ["string", "null"], format: uuid }
        createdAt: { type: string, format: date-time }
      required: [id, eventType, description, tenantId, createdAt]
    ModuleDefinition:
      type: object
      properties:
        key: { $ref: "#/components/schemas/ModuleKey" }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        sandboxAvailable: { type: boolean }
      required: [key, name, description, category, sandboxAvailable]
    AssetNetwork:
      type: object
      properties:
        assetId: { type: string }
        assetNetworkId: {type: string}
        symbol: { type: string }
        name: { type: string }
        networkId: { type: string }
        networkName: { type: string }
        testnet: { type: boolean }
        logoUrl: {type: ["string", "null"]}
        decimals: {type: integer}
      required: [assetId, symbol, name, networkId, networkName, testnet]
    AssetNetworkCatalog:
      type: object
      properties:
        assets:
          type: array
          items: { $ref: "#/components/schemas/AssetNetwork" }
        sandboxOnly: { type: boolean }
      required: [assets, sandboxOnly]
    TenantInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, minLength: 2, maxLength: 48, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        planId: { type: string, format: uuid }
      required: [name, slug, planId]
    BrandInput:
      type: object
      properties:
        brandName: { type: string, minLength: 2, maxLength: 120 }
        logoUrl: { type: ["string", "null"], maxLength: 2048 }
        primaryColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        accentColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        themeMode: { type: string, enum: [light, dark, system] }
        defaultLanguage: { type: string, minLength: 2, maxLength: 12 }
        supportedLanguages:
          type: array
          items: { type: string, minLength: 2, maxLength: 12 }
      required: [brandName, logoUrl, primaryColor, accentColor, themeMode, defaultLanguage, supportedLanguages]
    DomainInput:
      type: object
      properties:
        domain: { type: ["string", "null"], maxLength: 253 }
      required: [domain]
    TenantModulesInput:
      type: object
      properties:
        moduleKeys:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/ModuleKey" }
      required: [moduleKeys]
    AssetsNetworksInput:
      type: object
      properties:
        assetNetworkIds:
          type: array
          uniqueItems: true
          items: { type: string }
      required: [assetNetworkIds]
    TenantConfigurationInput:
      type: object
      properties:
        environment: { type: string, enum: [sandbox] }
        exchangeEnabled: { type: boolean }
        paymentsEnabled: { type: boolean }
        allowGuestCheckout: { type: boolean }
      required: [environment, exchangeEnabled, paymentsEnabled, allowGuestCheckout]
    TenantSummary:
      type: object
      properties:
        exchangeProvisioned: {type: boolean}
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        brandName: { type: string }
        domain: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/TenantStatus" }
        enabledModules:
          type: array
          items: { $ref: "#/components/schemas/ModuleKey" }
        provisioningStep: { $ref: "#/components/schemas/ProvisioningStep" }
        environment: { type: string, enum: [sandbox] }
        createdAt: { type: string, format: date-time }
      required: [id, name, slug, brandName, domain, status, enabledModules, provisioningStep, environment, createdAt]
    Tenant:
      allOf:
        - $ref: "#/components/schemas/TenantSummary"
        - type: object
          properties:
            logoUrl: { type: ["string", "null"] }
            primaryColor: { type: string }
            accentColor: { type: string }
            themeMode: { type: string, enum: [light, dark, system] }
            defaultLanguage: { type: string }
            supportedLanguages:
              type: array
              items: { type: string }
            assetNetworkIds:
              type: array
              items: { type: string }
            exchangeEnabled: { type: boolean }
            paymentsEnabled: { type: boolean }
            allowGuestCheckout: { type: boolean }
            configurationComplete: { type: boolean }
            websiteSettings: {$ref: "#/components/schemas/WebsiteSettings"}
          required: [logoUrl, primaryColor, accentColor, themeMode, defaultLanguage, supportedLanguages, assetNetworkIds, exchangeEnabled, paymentsEnabled, allowGuestCheckout, configurationComplete]
    EntitlementValue:
      oneOf: [{type: boolean}, {type: string, pattern: "^[0-9]+(?:\\.[0-9]{1,18})?$", maxLength: 38}]
    EntitlementEntry:
      type: object
      properties:
        key: {type: string, pattern: "^[a-z][a-z0-9_]*$", maxLength: 80}
        value: {$ref: "#/components/schemas/EntitlementValue"}
      required: [key, value]
    EntitlementDefinition:
      type: object
      properties:
        key: {type: string}
        label: {type: string}
        kind: {type: string, enum: [feature, limit]}
        valueType: {type: string, enum: [boolean, integer, decimal]}
      required: [key, label, kind, valueType]
    PlanInput:
      type: object
      properties:
        name: {type: string, minLength: 2, maxLength: 120}
        description: {type: string, maxLength: 3000}
        monthlyPrice: {type: string, pattern: "^[0-9]+(?:\\.[0-9]{1,2})?$", maxLength: 18}
        yearlyPrice: {type: string, pattern: "^[0-9]+(?:\\.[0-9]{1,2})?$", maxLength: 18}
        setupFee: {type: string, pattern: "^[0-9]+(?:\\.[0-9]{1,2})?$", maxLength: 18}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        billingLabel: {type: string, maxLength: 160}
        displayOrder: {type: integer, minimum: 0, maximum: 100000}
        status: {type: string, enum: [enabled, disabled, archived]}
        entitlements: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/EntitlementEntry"}}
      required: [name, description, monthlyPrice, yearlyPrice, setupFee, currency, billingLabel, displayOrder, status, entitlements]
    Plan:
      allOf:
        - {$ref: "#/components/schemas/PlanInput"}
        - type: object
          properties:
            id: {type: string, format: uuid}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
          required: [id, createdAt, updatedAt]
    PlanStatusInput:
      type: object
      properties: {status: {type: string, enum: [enabled, disabled, archived]}}
      required: [status]
    AddonInput:
      type: object
      properties:
        monthlyPrice: {type: ["string", "null"], pattern: '^\d{1,12}(\.\d{1,2})?$'}
        yearlyPrice: {type: ["string", "null"], pattern: '^\d{1,12}(\.\d{1,2})?$'}
        setupFee: {type: ["string", "null"], pattern: '^\d{1,12}(\.\d{1,2})?$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        name: {type: string, minLength: 2, maxLength: 120}
        description: {type: string, maxLength: 3000}
        enabled: {type: boolean}
        entitlements: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/EntitlementEntry"}}
      required: [name, description, enabled, entitlements]
    Addon:
      allOf:
        - {$ref: "#/components/schemas/AddonInput"}
        - type: object
          properties: {id: {type: string, format: uuid}, pricingConfigured: {type: boolean}}
          required: [id]
    SubscriptionPlanInput:
      type: object
      properties: {planId: {type: string, format: uuid}}
      required: [planId]
    SubscriptionAddonInput:
      type: object
      properties: {addonIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}}
      required: [addonIds]
    EntitlementOverride:
      allOf:
        - {$ref: "#/components/schemas/EntitlementEntry"}
        - type: object
          properties: {reason: {type: string, minLength: 2, maxLength: 500}}
          required: [reason]
    EntitlementOverrideInput:
      type: object
      properties: {overrides: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/EntitlementOverride"}}}
      required: [overrides]
    UsageItem:
      type: object
      properties:
        key: {type: string}
        label: {type: string}
        used: {type: string}
        limit: {type: string}
        exceeded: {type: boolean}
      required: [key, label, used, limit, exceeded]
    SubscriptionView:
      type: object
      properties:
        tenantId: {type: string, format: uuid}
        tenantStatus: {type: string}
        status: {type: string, enum: [active, suspended, unassigned]}
        plan:
          oneOf: [{$ref: "#/components/schemas/Plan"}, {type: "null"}]
        addons: {type: array, items: {$ref: "#/components/schemas/Addon"}}
        overrides: {type: array, items: {$ref: "#/components/schemas/EntitlementOverride"}}
        features: {type: object, additionalProperties: {type: boolean}}
        limits: {type: object, additionalProperties: {type: string}}
        sources: {type: object, additionalProperties: {type: string}}
        usage: {type: array, items: {$ref: "#/components/schemas/UsageItem"}}
        enabledModules: {type: array, items: {type: string}}
        overLimit: {type: boolean}
      required: [tenantId, tenantStatus, status, plan, addons, overrides, features, limits, sources, usage, enabledModules, overLimit]
    SuspensionInput:
      type: object
      properties: {suspended: {type: boolean}, reason: {type: string, minLength: 2, maxLength: 500}}
      required: [suspended, reason]
    WebsiteSettings:
      type: object
      properties:
        navigation:
          type: array
          maxItems: 12
          items:
            type: object
            properties:
              key: {type: string, enum: [exchange, payments, telegram, how, developers, about, faq]}
              label: {type: string, minLength: 1, maxLength: 60}
              visible: {type: boolean}
            required: [key, label, visible]
        secondaryColor: {type: string, pattern: "^#[0-9A-Fa-f]{6}$"}
        glowColor: {type: string, pattern: "^#[0-9A-Fa-f]{6}$"}
        surfaceStyle: {type: string, enum: [solid, glass]}
        borderRadius: {type: string, enum: [sharp, soft, rounded]}
        faq: {type: array, maxItems: 16, items: {$ref: "#/components/schemas/WebsiteFaq"}}
        faviconUrl: {type: ["string", "null"], maxLength: 2048}
        fontKey: {type: string, enum: [system, inter, manrope, dm-sans, space-grotesk]}
        heroTitle: {type: string, minLength: 2, maxLength: 180}
        heroSubtitle: {type: string, maxLength: 1000}
        supportEmail: {type: ["string", "null"], maxLength: 254}
        supportUrl: {type: ["string", "null"], maxLength: 2048}
        supportDetails: {type: string, maxLength: 2000}
        socialLinks: {type: array, maxItems: 12, items: {$ref: "#/components/schemas/SiteLink"}}
        footerText: {type: string, maxLength: 2000}
        privacyContent: {type: string, maxLength: 20000}
        termsContent: {type: string, maxLength: 20000}
      required: [secondaryColor, faviconUrl, fontKey, heroTitle, heroSubtitle, supportEmail, supportUrl, supportDetails, socialLinks, footerText, privacyContent, termsContent]
    WebsiteFaq:
      type: object
      properties:
        question: {type: string, minLength: 2, maxLength: 180}
        answer: {type: string, minLength: 2, maxLength: 2000}
      required: [question, answer]
    SiteLink:
      type: object
      properties: {label: {type: string, minLength: 1, maxLength: 80}, url: {type: string, maxLength: 2048}}
      required: [label, url]
    ResourceInput:
      type: object
      properties: {label: {type: string, minLength: 2, maxLength: 120}, reference: {type: ["string", "null"], maxLength: 2048}}
      required: [label, reference]
    ResourceItem:
      type: object
      properties:
        id: {type: string}
        label: {type: string}
        reference: {type: ["string", "null"]}
        status: {type: string}
        permissions: {type: array, items: {type: string}}
      required: [id, label, reference, status]
    ResourceCreated:
      type: object
      properties: {item: {$ref: "#/components/schemas/ResourceItem"}, issuedKey: {type: ["string", "null"]}}
      required: [item, issuedKey]
    MutationStatus:
      type: object
      properties: {ok: {type: boolean}}
      required: [ok]
    PublicSite:
      type: object
      properties:
        tenantSlug: {type: string}
        brandName: {type: string}
        logoUrl: {type: ["string", "null"]}
        primaryColor: {type: string}
        accentColor: {type: string}
        themeMode: {type: string, enum: [light, dark, system]}
        domain: {type: ["string", "null"]}
        sandboxOnly: {type: boolean}
        websiteSettings: {$ref: "#/components/schemas/WebsiteSettings"}
        features: {type: object, additionalProperties: {type: boolean}}
        assets: {type: array, items: {$ref: "#/components/schemas/AssetNetwork"}}
      required: [tenantSlug, brandName, logoUrl, primaryColor, accentColor, themeMode, domain, sandboxOnly, websiteSettings, features, assets]
    CapabilityStatus:
      type: object
      properties: {feature: {type: string}, status: {type: string}, message: {type: string}}
      required: [feature, status, message]

