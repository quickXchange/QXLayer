kind = "web"
previewPath = "/"
title = "QXLayer Main Platform"
description = "Main public platform landing page, product showcases and catalog pricing, with sign-in and account requests. Administration remains available on dedicated protected routes."
version = "1.0.0"
id = "artifacts/private-label-console"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24073

[services.development]
run = "pnpm --filter @workspace/private-label-console run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/private-label-console", "run", "build" ]
[services.production.run]
args = [ "node", "lib/production-access-gate/serve.mjs", "artifacts/private-label-console/dist/public" ]

[services.production.run.env]
NODE_ENV = "production"

[services.production.health.startup]
path = "/__qx_access/healthz"

[services.env]
PORT = "24073"
BASE_PATH = "/"
