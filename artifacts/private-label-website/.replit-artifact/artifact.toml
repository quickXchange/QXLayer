kind = "web"
previewPath = "/private-label-website/nexa-sandbox"
title = "White Label Client Sites"
description = "Tenant-specific branded sandbox websites at /private-label-website/{slug}. Root forwards to the main platform; the development Site Finder is at /private-label-website/sandbox/site-finder."
version = "1.0.0"
id = "artifacts/private-label-website"
router = "path"

[[services]]
name = "web"
paths = [ "/private-label-website/" ]
localPort = 24270

[services.development]
run = "pnpm --filter @workspace/private-label-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/private-label-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/private-label-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24270"
BASE_PATH = "/private-label-website/"
